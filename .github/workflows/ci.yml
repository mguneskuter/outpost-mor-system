name: CI

# Automatic runs are disabled; the workflow runs only when started by hand. Restore the
# commented triggers to run it on every pull request and push to main again.
on:
  workflow_dispatch:
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main]

jobs:
  # `make verify` is the whole gate, so no path filter narrows it and no suite runs twice.
  # Testcontainers starts PostgreSQL itself; the job needs no database service.
  verify:
    name: Build, test, and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            bin/
          key: ${{ runner.os }}-tooling-${{ hashFiles('local/setup.sh', '.github/ci/*.sh', '.pre-commit-config.yaml', 'outpost/gradle/wrapper/gradle-wrapper.properties') }}
      - run: python3 -m pip install pre-commit
      - run: ./.github/ci/setup.sh
      - run: make precommit PRECOMMIT_SKIP=build,no-commit-to-branch
      - run: make verify

  security:
    name: Dependency and image vulnerability scan
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - run: make images
      - name: Scan Gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gateway-api:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan Ledger image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledger-api:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan PSP simulator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: psp-simulator:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan back office image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: backoffice:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
