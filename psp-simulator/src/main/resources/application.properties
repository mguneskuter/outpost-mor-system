spring.application.name=psp-simulator
server.port=8083

# The simulator's own schema: Flyway creates it and keeps its history table there,
# so it never touches the Outpost tables in public.
spring.flyway.schemas=psp_simulator
spring.flyway.default-schema=psp_simulator
spring.flyway.locations=classpath:db/migration

# Shares the local PostgreSQL instance with Outpost; the psp_simulator schema stays separate.
spring.datasource.url=${OUTPOST_DB_URL:jdbc:postgresql://localhost:${OUTPOST_DB_PORT:5432}/outpost?currentSchema=psp_simulator}
spring.datasource.username=${OUTPOST_DB_USER:outpost}
spring.datasource.password=${OUTPOST_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# The base URL the simulator reports in payment links, and the base URL webhooks are posted to.
simulator.public-url=http://localhost:8083
simulator.outpost-base-url=http://localhost:8080

# Authorisation is a random delay within the range; capture and refund follow after their own
# delays. Set all to zero to see every webhook immediately.
simulator.delays.authorisation-min=PT2S
simulator.delays.authorisation-max=PT5S
simulator.delays.capture=PT1S
simulator.delays.refund=PT1S

# Demo PSP, matching the demo PSP account Outpost is configured with.
simulator.psps[0].code=DEMO_PSP
simulator.psps[0].api-key=${OUTPOST_PSP_SIMULATOR_API_KEY}
simulator.psps[0].hmac-secret=${OUTPOST_PSP_SIMULATOR_HMAC_SECRET}
