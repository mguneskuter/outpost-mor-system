spring.application.name=gateway-api
management.server.port=9080
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
logging.structured.format.console=logstash
logging.structured.json.add.application=${spring.application.name}
spring.datasource.url=${OUTPOST_DB_URL:jdbc:postgresql://localhost:${OUTPOST_DB_PORT:5432}/outpost}
spring.datasource.username=${OUTPOST_DB_USER:outpost}
spring.datasource.password=${OUTPOST_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
outpost.gateway.ledger.base-url=${OUTPOST_LEDGER_BASE_URL:http://localhost:8081}
outpost.gateway.ledger.hmac-secret=${OUTPOST_LEDGER_GATEWAY_HMAC_SECRET:}
outpost.gateway.ledger.connect-timeout=${OUTPOST_LEDGER_CONNECT_TIMEOUT:PT1S}
outpost.gateway.ledger.read-timeout=${OUTPOST_LEDGER_READ_TIMEOUT:PT5S}
outpost.gateway.psp-client.connect-timeout=PT10S
outpost.gateway.psp-client.read-timeout=PT30S
