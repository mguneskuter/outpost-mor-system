plugins {
    id 'outpost.java-conventions'
    id 'java-library'
    id 'java-test-fixtures'
}

sourceSets {
    cli
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter-jdbc'
    api 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // The Flyway CLI (make migrate) deliberately avoids the Spring/MyBatis runtime
    // tree: it needs only Flyway, the Postgres driver, and SLF4J.
    cliImplementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    cliImplementation 'org.flywaydb:flyway-core'
    cliImplementation 'org.flywaydb:flyway-database-postgresql'
    cliImplementation 'org.postgresql:postgresql'
    cliImplementation 'org.slf4j:slf4j-api'
    cliImplementation 'org.slf4j:slf4j-jdk14'
    cliCompileOnly 'org.jspecify:jspecify:1.0.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':account:domain')
    testImplementation project(':common-iso:domain')
    testImplementation project(':accounting:domain')
    testImplementation project(':merchant-configuration:domain')
    testImplementation project(':payment:common:domain')
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.testcontainers:testcontainers-postgresql'
}

configurations {
    testFixturesImplementation {
        extendsFrom implementation
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.testFixtures.output
        runtimeClasspath += sourceSets.testFixtures.output
    }
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'outpost.migration.location', rootProject.file('db/migration').absolutePath
    systemProperty 'outpost.control.location', rootProject.file('db/control').absolutePath
}

// Resolves the narrow Flyway CLI classpath to a file so `make migrate` can run the
// CLI with plain `java` (Gradle's JavaExec interferes with Flyway's plugin loading).
tasks.register('writeCliClasspath') {
    def outFile = layout.buildDirectory.file('cli/classpath.txt')
    doLast {
        def cp = sourceSets.cli.runtimeClasspath.asPath + File.pathSeparator + sourceSets.cli.output.asPath
        outFile.get().asFile.parentFile.mkdirs()
        outFile.get().asFile.text = cp
    }
    outputs.file(outFile)
}
