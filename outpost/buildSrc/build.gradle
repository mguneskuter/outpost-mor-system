plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    implementation 'com.diffplug.spotless:com.diffplug.spotless.gradle.plugin:8.10.2'
    implementation 'net.ltgt.errorprone:net.ltgt.errorprone.gradle.plugin:5.1.0'
    testImplementation gradleTestKit()
    testImplementation 'junit:junit:4.13.2'
}

gradlePlugin {
    plugins {
        javaConventions {
            id = 'outpost.java-conventions'
            implementationClass = 'com.outpost.JavaConventionsPlugin'
        }
        moduleGraphVerification {
            id = 'outpost.module-graph-verification'
            implementationClass = 'com.outpost.ModuleGraphVerificationPlugin'
        }
    }
}
