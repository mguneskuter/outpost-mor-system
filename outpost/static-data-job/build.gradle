plugins {
    id 'outpost.java-conventions'
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':framework:persistence')
    implementation project(':platform-sanity:static-data-check')
    implementation project(':platform-sanity:static-data-repository')
    implementation project(':common-iso:repository')
    implementation project(':common-iso:domain')
    implementation project(':payment:common:repository')
    implementation project(':payment:common:domain')
    implementation project(':account:repository')
    implementation project(':account:domain')
    implementation project(':merchant-configuration:repository')
    implementation project(':merchant-configuration:domain')
    implementation project(':accounting:domain')
    implementation project(':accounting:repository')
    implementation project(':tax:domain')
    implementation project(':fx:domain')
    implementation project(':payment:domain')
    implementation project(':payment:repository')
    implementation project(':psp-integration:domain')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation testFixtures(project(':framework:persistence'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'com.outpost.platform.staticdata.job.EnsureStaticDataJobApplication'
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/builder-noble-java-tiny:0.0.187'
    environment = ['BP_JVM_VERSION': '21.0.12']
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'outpost.migration.location', rootProject.file('db/migration').absolutePath
}
