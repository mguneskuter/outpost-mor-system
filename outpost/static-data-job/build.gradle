plugins {
    id 'outpost.java-conventions'
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':framework:persistence')
    implementation project(':platform-sanity:static-data-check')
    implementation project(':platform-sanity:static-data-repository')
    implementation project(':common-iso-static-data')
    implementation project(':common-iso')
    implementation project(':common-payment-static-data')
    implementation project(':common-payment')
    implementation project(':account-configuration-static-data')
    implementation project(':account-configuration')
    implementation project(':merchant-configuration-static-data')
    implementation project(':framework:persistence')
    implementation project(':merchant-configuration')
    implementation project(':accounting')
    implementation project(':tax')
    implementation project(':fx')
    implementation project(':payment')
    implementation project(':psp-integration')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation testFixtures(project(':framework:persistence'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'com.outpost.platform.staticdata.job.EnsureStaticDataJobApplication'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'outpost.migration.location', rootProject.file('db/migration').absolutePath
}
