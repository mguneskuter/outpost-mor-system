}

dependencies {
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(':platform-sanity:static-data-model')
    testImplementation project(':common-iso:domain')
    testImplementation project(':payment:common:domain')
    testImplementation project(':account:domain')
    testImplementation project(':merchant-configuration:domain')
    testImplementation project(':accounting:domain')
    testImplementation project(':tax:domain')
    testImplementation project(':fx:domain')
    testImplementation project(':payment:domain')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
