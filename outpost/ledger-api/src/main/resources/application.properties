spring.application.name=ledger-api
server.port=8081
management.server.port=9081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
logging.structured.format.console=logstash
logging.structured.json.add.application=${spring.application.name}
spring.datasource.url=${OUTPOST_DB_URL:jdbc:postgresql://localhost:${OUTPOST_DB_PORT:5432}/outpost}
spring.datasource.username=${OUTPOST_DB_USER:outpost}
spring.datasource.password=${OUTPOST_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
outpost.ledger.gateway-hmac-secret=${OUTPOST_LEDGER_GATEWAY_HMAC_SECRET:}
outpost.ledger.worker-hmac-secret=${OUTPOST_LEDGER_WORKER_HMAC_SECRET:}
