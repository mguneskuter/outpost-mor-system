plugins {
    id 'outpost.java-conventions'
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':framework:logging')
    implementation project(':framework:persistence')
    implementation project(':framework:security')
    implementation project(':framework:healthprobe')
    implementation project(':framework:queue-processor')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation project(':platform-sanity:static-data-check')
    implementation project(':accounting:persistence')
    implementation project(':accounting:domain')
    implementation project(':common-iso:domain')
    implementation project(':common-payment:domain')
    implementation project(':account:domain')
    implementation project(':merchant-configuration:domain')
    implementation project(':tax')
    implementation project(':fx')
    implementation project(':accounting:api')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':accounting:api-client')
    testImplementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation testFixtures(project(':framework:persistence'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
    mainClass = 'com.outpost.ledger.LedgerApiApplication'
}

tasks.named('bootBuildImage') {
    imageName = 'ledger-api:latest'
    builder = 'paketobuildpacks/builder-noble-java-tiny:0.0.187'
    environment = ['BP_JVM_VERSION': '21.0.12']
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'outpost.migration.location', rootProject.file('db/migration').absolutePath
}
