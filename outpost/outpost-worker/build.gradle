plugins {
    id 'outpost.java-conventions'
    id 'org.springframework.boot'
}

springBoot {
    mainClass = 'com.outpost.worker.OutpostWorkerApplication'
}

tasks.named('bootBuildImage') {
    imageName = 'outpost-worker:latest'
    builder = 'paketobuildpacks/builder-noble-java-tiny:0.0.187'
    environment = ['BP_JVM_VERSION': '21.0.12']
}

dependencies {
    implementation project(':framework:logging')
    implementation project(':framework:persistence')
    implementation project(':framework:security')
    implementation project(':framework:healthprobe')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation project(':platform-sanity:static-data-check')
    implementation project(':common-iso:domain')
    implementation project(':common-payment:domain')
    implementation project(':account:domain')
    implementation project(':merchant-configuration:domain')
    implementation project(':payment:domain')
    implementation project(':payment:repository')
    implementation project(':accounting:domain')
    implementation project(':accounting:queue-api')
    implementation project(':accounting:api')
    implementation project(':accounting:api-client')
    implementation project(':psp-integration:domain')
    implementation project(':psp-integration:client')

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation testFixtures(project(':framework:persistence'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'outpost.migration.location', rootProject.file('db/migration').absolutePath
}
