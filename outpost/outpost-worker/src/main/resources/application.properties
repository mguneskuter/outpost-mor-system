spring.application.name=outpost-worker
server.port=8082
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
logging.structured.format.console=logstash
logging.structured.json.add.application=${spring.application.name}
spring.datasource.url=${OUTPOST_DB_URL:jdbc:postgresql://localhost:${OUTPOST_DB_PORT:5432}/outpost}
spring.datasource.username=${OUTPOST_DB_USER:outpost}
spring.datasource.password=${OUTPOST_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
outpost.worker.psp.worker-count=2
outpost.worker.psp.poll-interval=PT1S
outpost.worker.accounting.worker-count=2
outpost.worker.accounting.poll-interval=PT1S
outpost.worker.ledger.base-url=${OUTPOST_LEDGER_BASE_URL:}
outpost.worker.ledger.hmac-secret=${OUTPOST_WORKER_LEDGER_HMAC_SECRET:}
outpost.worker.ledger.connect-timeout=PT1S
outpost.worker.ledger.read-timeout=PT5S
