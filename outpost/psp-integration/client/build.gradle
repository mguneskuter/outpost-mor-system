plugins { id 'outpost.java-conventions' }

group = 'com.outpost.integration.psp'
base { archivesName = 'psp-integration-client' }

dependencies {
    implementation project(':psp-integration:domain')
    implementation project(':payment:common:domain')
    implementation project(':common-iso:domain')
    implementation project(':framework:persistence')
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':account:domain')
    testImplementation testFixtures(project(':framework:persistence'))
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'outpost.migration.location', rootProject.file('db/migration').absolutePath
}
