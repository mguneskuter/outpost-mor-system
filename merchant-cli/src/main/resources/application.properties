spring.application.name=merchant-cli
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=warn
spring.datasource.url=${OUTPOST_DB_URL:jdbc:postgresql://localhost:${OUTPOST_DB_PORT:5432}/outpost}
spring.datasource.username=${OUTPOST_DB_USER:outpost}
spring.datasource.password=${OUTPOST_DB_PASSWORD}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
merchant.cli.gateway-base-url=${OUTPOST_GATEWAY_BASE_URL:http://localhost:8080}
merchant.cli.operator-api-key=${OUTPOST_OPERATOR_API_KEY}
merchant.cli.psp-api-key=${OUTPOST_PSP_SIMULATOR_API_KEY}
merchant.cli.merchants.DEMO_MERCHANT.api-key=${OUTPOST_MERCHANT_API_KEY}
merchant.cli.merchants.DEMO_MERCHANT.hmac-secret=${OUTPOST_MERCHANT_HMAC_SECRET}
# The second demo merchant's key and secret are the ones local/seed_data/merchant_api_key.sql seeds.
merchant.cli.merchants.DEMO_MERCHANT_2.api-key=demo-merchant-2-api-key
merchant.cli.merchants.DEMO_MERCHANT_2.hmac-secret=demo-merchant-2-hmac-secret
