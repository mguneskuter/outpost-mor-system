spring.application.name=backoffice
server.port=8090
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.outpost.backoffice=info
spring.thymeleaf.cache=false
spring.datasource.url=${OUTPOST_DB_URL:jdbc:postgresql://localhost:${OUTPOST_DB_PORT:5432}/outpost}
spring.datasource.username=${OUTPOST_DB_USER:outpost}
spring.datasource.password=${OUTPOST_DB_PASSWORD}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
backoffice.gateway-base-url=${OUTPOST_GATEWAY_BASE_URL:http://localhost:8080}
backoffice.operator-api-key=${OUTPOST_OPERATOR_API_KEY}
backoffice.psp-api-key=${OUTPOST_PSP_SIMULATOR_API_KEY}
# Set inside the Compose network, where the payment links' localhost host is not the simulator.
backoffice.psp-base-url=${OUTPOST_BACKOFFICE_PSP_BASE_URL:}
backoffice.merchants.DEMO_MERCHANT.api-key=${OUTPOST_MERCHANT_API_KEY}
backoffice.merchants.DEMO_MERCHANT.hmac-secret=${OUTPOST_MERCHANT_HMAC_SECRET}
# The second demo merchant's key and secret are the ones local/seed_data/merchant_api_key.sql seeds.
backoffice.merchants.DEMO_MERCHANT_2.api-key=demo-merchant-2-api-key
backoffice.merchants.DEMO_MERCHANT_2.hmac-secret=demo-merchant-2-hmac-secret
backoffice.catalogue[0].sku=EBOOK
backoffice.catalogue[0].name=Bookkeeping for Merchants (e-book)
backoffice.catalogue[0].amount=1900
backoffice.catalogue[0].currency=EUR
backoffice.catalogue[0].type=DIGITAL_GOODS
backoffice.catalogue[1].sku=TSHIRT
backoffice.catalogue[1].name=Outpost T-shirt
backoffice.catalogue[1].amount=2500
backoffice.catalogue[1].currency=EUR
backoffice.catalogue[1].type=PHYSICAL_GOODS
backoffice.catalogue[2].sku=POSTER
backoffice.catalogue[2].name=Ledger poster
backoffice.catalogue[2].amount=8000
backoffice.catalogue[2].currency=EUR
backoffice.catalogue[2].type=PHYSICAL_GOODS
backoffice.catalogue[3].sku=MUG
backoffice.catalogue[3].name=Outpost mug
backoffice.catalogue[3].amount=1500
backoffice.catalogue[3].currency=USD
backoffice.catalogue[3].type=PHYSICAL_GOODS
backoffice.catalogue[4].sku=COURSE
