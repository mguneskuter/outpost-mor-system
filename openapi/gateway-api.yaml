openapi: 3.1.0
info:
  title: Outpost Gateway API
  version: "1"
  description: |
    Outpost's merchant-facing API. A merchant creates orders, refunds them, lists the PSPs it may
    pay through, and reads the balances posted to its account over a period. The operator reads
    the same report for every merchant, tax authority, and platform account. PSPs deliver payment
    events to the webhook route.

    Every refused or failed request answers `ErrorResponse`, except the PSP webhook, whose
    acknowledgement carries its result code so the PSP does not redeliver a rejected event.
servers:
  - url: http://localhost:8080
    description: The local platform started by `make up`
security:
  - MerchantApiKey: []
    MerchantSignature: []
tags:
  - name: Orders
  - name: PSPs
  - name: Reports
  - name: PSP webhooks
paths:
  /v1/order:
    post:
      tags: [Orders]
      summary: Create an order and the payment that collects it
      description: |
        Prices the order for the shopper's jurisdiction, stores it, creates the payment at the
        chosen PSP, and answers the payment link. A repeat under the same `idempotency_key` with
        the same body answers the stored order; a different body answers `409`.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: The order and its payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: |
            A field failed its constraint, the body could not be read, or the lines do not add
            up. Codes: `INVALID_MERCHANT_REFERENCE`, `INVALID_IDEMPOTENCY_KEY`,
            `INVALID_PSP_CODE`, `INVALID_SHOPPER_DETAILS`, `INVALID_SHOPPER_DETAILS_FULL_NAME`,
            `INVALID_SHOPPER_DETAILS_EMAIL`, `INVALID_SHOPPER_DETAILS_COUNTRY`,
            `INVALID_ORDER_DETAILS`, `INVALID_ORDER_LINES`, `INVALID_ORDER_LINE`,
            `INVALID_ORDER_DETAILS_TOTAL_AMOUNT`, `INVALID_ORDER_DETAILS_CURRENCY`,
            `INVALID_MERCHANT_LINE_REFERENCE`, `INVALID_ORDER_LINES_AMOUNT`,
            `INVALID_ORDER_LINES_CURRENCY`, `INVALID_ORDER_LINES_TYPE`, `INVALID_REQUEST`,
            `UNSUPPORTED_CURRENCY`, `DUPLICATE_MERCHANT_LINE_REFERENCE`, `MIXED_CURRENCIES`,
            `INVALID_PRODUCT_TYPE`, `TOTAL_AMOUNT_MISMATCH`, `AMOUNT_OVERFLOW`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`UNAUTHENTICATED`, or `MERCHANT_NOT_FOUND` when the key's merchant account is not active"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: "`MERCHANT_REQUIRED`: the operator key cannot create orders"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`: the key was used by a different request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            The platform cannot price or book the order. Codes: `INVALID_COUNTRY`,
            `INVALID_STATE`, `TAX_RATE_UNAVAILABLE`, `PSP_UNAVAILABLE`,
            `MISSING_FEE_CONFIGURATION`, `MISSING_TAX_AUTHORITY`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`PSP_RETRYABLE`: the PSP did not accept the payment; the order is stored and the same request may be repeated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/order/modification:
    post:
      tags: [Orders]
      summary: Refund whole lines of an order
      description: |
        Refunds the named order lines, or every line not yet refunded when none is named. The
        lines are claimed in the store before the PSP is asked for their total, so a line is never
        refunded twice: a request naming a claimed line, or an order with no line left, answers
        `409`, and a repeated request answers `409` rather than replaying the first answer. The
        Ledger books the refund when the PSP's `REFUND` event confirms it; a refund the PSP refuses
        releases its lines.
      operationId: modifyOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderModificationRequest"
      responses:
        "202":
          description: The PSP acknowledged the refund; its `REFUND` event reports the outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderModificationResponse"
        "400":
          description: |
            Codes: `INVALID_ORDER_REFERENCE`, `INVALID_IDEMPOTENCY_KEY`,
            `INVALID_MERCHANT_REFERENCE`, `INVALID_TYPE`, `INVALID_ORDER_LINE_REFERENCES`,
            `INVALID_ORDER_LINE_REFERENCE`, `INVALID_REQUEST`, `UNSUPPORTED_MODIFICATION_TYPE`,
            `ORDER_NOT_FOUND` (no order of this merchant has the reference),
            `ORDER_LINE_NOT_FOUND` (a named reference is not a line of the order),
            `DUPLICATE_ORDER_LINE_REFERENCE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`MERCHANT_REQUIRED`: the operator key cannot modify orders"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Codes: `ORDER_NOT_PAID` (the order has no payment at the PSP yet),
            `ORDER_LINE_ALREADY_REFUNDED` (a named line has a refund that has not failed),
            `ORDER_ALREADY_REFUNDED` (every line has a refund that has not failed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "`REFUND_REJECTED`: the PSP refused the refund"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "`PSP_RETRYABLE`: the PSP's answer was lost or unclassifiable; the lines stay claimed until the PSP's `REFUND` event arrives"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/psps:
    get:
      tags: [PSPs]
      summary: List the PSPs the caller may pay through
      operationId: listPsps
      responses:
        "200":
          description: The enabled PSPs, ordered by code; empty for the operator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPspsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/report:
    get:
      tags: [Reports]
      summary: Build a balance report over a period
      description: |
        Builds the caller's report and answers the URL it can be read at. A merchant's report
        covers the account its key authenticated, whatever the request says; the operator's covers
        every merchant, tax authority, and platform account. Both dates are inclusive calendar days
        in UTC, and the period spans at most thirty days.
      operationId: createReport
      security:
        - OperatorApiKey: []
        - MerchantApiKey: []
          MerchantSignature: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: The URL of the built report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportLinkResponse"
        "400":
          description: "`INVALID_REPORT_PERIOD`: `to` is before `from` or more than 29 days after it; `INVALID_REQUEST`: a date is absent or unreadable"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "`UNAUTHENTICATED`, or `MERCHANT_NOT_FOUND` when the key's merchant account is not active"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/report/{reportId}:
    get:
      tags: [Reports]
      summary: Read a built report
      description: |
        Any authenticated key reads any built report. The Gateway keeps the most recent reports in
        memory; an evicted or never built report answers `404`.
      operationId: readReport
      security:
        - OperatorApiKey: []
        - MerchantApiKey: []
          MerchantSignature: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceReport"
        "400":
          description: "`INVALID_REQUEST`: the identifier is not a UUID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: "`REPORT_NOT_FOUND`: no report is stored under the identifier"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/psp/{pspCode}/webhook:
    post:
      tags: [PSP webhooks]
      summary: Receive a PSP payment event
      description: |
        Authenticated by the PSP's HMAC-SHA-256 signature over the raw body. A matching event is
        queued for the Ledger. An authenticated event that matches no stored payment is
        acknowledged with a negative result so the PSP does not redeliver it.
      operationId: receivePspWebhook
      security:
        - PspSignature: []
      parameters:
        - name: pspCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PspWebhookEventRequest"
      responses:
        "200":
          description: "Acknowledged. `code` is `ACCEPTED`, or `UNKNOWN_PAYMENT`, `FOREIGN_PAYMENT`, `PSP_REFERENCE_MISMATCH` for an event that matches no stored payment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PspWebhookEventResponse"
        "400":
          description: "`INVALID_PAYLOAD`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PspWebhookEventResponse"
        "401":
          description: "`INVALID_SIGNATURE`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PspWebhookEventResponse"
        "404":
          description: "`UNKNOWN_PSP`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PspWebhookEventResponse"
        "413":
          description: The body is larger than 1 MiB; no body
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    MerchantApiKey:
      type: apiKey
      in: header
      name: X-Outpost-Api-Key
      description: The merchant's API key
    MerchantSignature:
      type: apiKey
      in: header
      name: X-Outpost-Signature
      description: Base64 HMAC-SHA-256 of the exact raw request body under the merchant's HMAC secret; an empty body is signed as zero bytes
    OperatorApiKey:
      type: apiKey
      in: header
      name: X-Outpost-Api-Key
      description: The operator's API key; no signature
    PspSignature:
      type: apiKey
      in: header
      name: X-Outpost-Signature
      description: Base64 HMAC-SHA-256 of the exact raw request body under the PSP's HMAC secret
  responses:
    Unauthenticated:
      description: "`UNAUTHENTICATED`: the key or signature does not verify"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BodyTooLarge:
      description: "`BODY_TOO_LARGE`: the body is larger than 1 MiB"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "`INTERNAL_ERROR`, with the `correlation_id` of the one log line that records the failure"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: A stable error code
        correlation_id:
          type: string
          description: Present on `INTERNAL_ERROR` only; finds the log line
    CreateOrderRequest:
      type: object
      required: [merchant_reference, idempotency_key, psp_code, shopper_details, order_details]
      properties:
        merchant_reference:
          type: string
          minLength: 1
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          description: One value means one request for the life of the merchant account
        psp_code:
          type: string
          minLength: 1
          description: A PSP code from `GET /v1/psps`
        shopper_details:
          $ref: "#/components/schemas/ShopperDetails"
        order_details:
          $ref: "#/components/schemas/OrderDetails"
    ShopperDetails:
      type: object
      required: [full_name, email, country]
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 254
        email:
          type: string
          minLength: 1
          maxLength: 254
        country:
          type: string
          description: ISO 3166-1 alpha-2 code of a supported country
          examples: [NL]
        state:
          type: string
          description: ISO 3166-2 subdivision code, required where the subdivision sets the tax
          examples: [US-CA]
        zipcode:
          type: string
    OrderDetails:
      type: object
      required: [order_lines, total_amount, currency]
      properties:
        order_lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/OrderLine"
        total_amount:
          type: integer
          format: int64
          minimum: 1
          description: The sum of the line amounts, net of tax, in minor units
        currency:
          type: string
          description: ISO 4217 code of a supported currency; every line uses it
    OrderLine:
      type: object
      required: [merchant_line_reference, amount, currency, type]
      properties:
        merchant_line_reference:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique within the order
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Net of tax, in minor units
        currency:
          type: string
        type:
          type: string
          enum: [DIGITAL_GOODS, PHYSICAL_GOODS]
    CreateOrderResponse:
      type: object
      required: [order_reference, created_at, payment_details, order_lines]
      properties:
        order_reference:
          type: string
          description: The reference under which the order, its payment, and its refund are booked
        created_at:
          type: string
          format: date-time
        payment_details:
          type: object
          required: [amount, currency, tax_amount, total_amount, payment_link]
          properties:
            amount:
              type: integer
              format: int64
              description: Net amount in minor units
            currency:
              type: string
            tax_amount:
              type: integer
              format: int64
            total_amount:
              type: integer
              format: int64
              description: Gross amount the shopper pays
            payment_link:
              type: string
              format: uri
        order_lines:
          type: array
          items:
            type: object
            required:
              - order_line_reference
              - merchant_line_reference
              - amount
              - tax_amount
              - total_amount
              - tax_rate
            properties:
              order_line_reference:
                type: string
              merchant_line_reference:
                type: string
              amount:
                type: integer
                format: int64
              tax_amount:
                type: integer
                format: int64
              total_amount:
                type: integer
                format: int64
              tax_rate:
                type: string
                description: The applied rate as a decimal fraction
                examples: ["0.21"]
    OrderModificationRequest:
      type: object
      required: [order_reference, idempotency_key, merchant_reference, type]
      properties:
        order_reference:
          type: string
          minLength: 1
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        merchant_reference:
          type: string
          minLength: 1
          maxLength: 128
        type:
          type: string
          enum: [REFUND]
        order_line_references:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: The `order_line_reference` of each line to refund; absent means every line not yet refunded
    OrderModificationResponse:
      type: object
      required: [refund_reference]
      properties:
        refund_reference:
          type: string
          description: The reference under which the refund is booked
    ListPspsResponse:
      type: object
      required: [psps]
      properties:
        psps:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code:
                type: string
              name:
                type: string
    ReportLinkResponse:
      type: object
      required: [report_url]
      properties:
        report_url:
          type: string
          format: uri
          description: Where the built report is read
    BalanceReport:
      type: object
      required: [from, to, accounts]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        accounts:
          type: array
          description: Ordered by account code
          items:
            type: object
            required: [account_code, balance_accounts]
            properties:
              account_code:
                type: string
              balance_accounts:
                type: array
                description: Every balance account of the account, ordered by code, even without balances
                items:
                  type: object
                  required: [balance_account_code, balances]
                  properties:
                    balance_account_code:
                      type: string
                    balances:
                      type: array
                      description: One per currency posted in the period, ordered by currency code
                      items:
                        type: object
                        required: [currency, balance]
                        properties:
                          currency:
                            type: string
                          balance:
                            type: string
                            description: The sum posted in the period, in major units as a decimal string, positive on the balance account's normal side
                            examples: ["76.00"]
    PspWebhookEventRequest:
      type: object
      required:
        - psp_code
        - psp_reference
        - payment_reference
        - event_code
        - timestamp
        - success
        - result_code
        - amount
        - currency
      properties:
        psp_code:
          type: string
        psp_reference:
          type: string
          description: The PSP's reference for the payment, as stored when the order was created
        psp_refund_reference:
          type: [string, "null"]
        payment_reference:
          type: string
          description: The Outpost order reference
        event_code:
          type: string
          enum: [AUTHORISATION, CAPTURE, REFUND]
        timestamp:
          type: integer
          format: int64
        success:
          type: boolean
        result_code:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        refund_reference:
          type: [string, "null"]
          description: Required for a `REFUND` event
        refund_lines:
          type: [array, "null"]
          description: Required for a `REFUND` event; the refunded lines exactly as the refund named them
          items:
            type: object
            required: [order_line_reference, tax_rate, net_amount, gross_amount]
            properties:
              order_line_reference:
                type: string
              tax_rate:
                type: string
                description: Decimal rate, compared by value
              net_amount:
                type: integer
                format: int64
                description: The line's net in minor units
              gross_amount:
                type: integer
                format: int64
                description: The line's net plus tax in minor units
    PspWebhookEventResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - ACCEPTED
            - UNKNOWN_PSP
            - INVALID_SIGNATURE
            - INVALID_PAYLOAD
            - UNKNOWN_PAYMENT
            - FOREIGN_PAYMENT
            - PSP_REFERENCE_MISMATCH
            - UNKNOWN_REFUND
