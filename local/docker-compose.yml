services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: outpost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: outpost
      POSTGRES_USER: outpost_bootstrap
      POSTGRES_PASSWORD: ${OUTPOST_DB_PASSWORD:?OUTPOST_DB_PASSWORD must be set in .env}
    ports:
      - "${OUTPOST_DB_PORT:-5432}:5432"
    volumes:
      - outpost-postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outpost -d outpost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  outpost-postgres-data:
